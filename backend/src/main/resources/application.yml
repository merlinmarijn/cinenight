server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  config:
    import: optional:file:env/backend.local.properties
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/cinenight?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=utf8
    username: ${DB_ROOT:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate.show_sql: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  cache:
    type: caffeine

  thymeleaf:
    encoding: UTF-8
    mode: HTML
    cache: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  messages:
    basename: messages
    encoding: UTF-8

logging.level:
  org.springframework.mail: DEBUG
  com.sun.mail: DEBUG

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://cinenight.tech}
  mail:
    from: "CineNight"
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://cinenight.tech,https://www.cinenight.tech,http://localhost:5173}
  guest:
    identity-pepper: ${APP_GUEST_IDENTITY_PEPPER:cinenight-local-dev-only}
    max-accounts-per-ip-per-24h: ${APP_GUEST_MAX_ACCOUNTS_PER_IP:3}
    trust-forwarded-headers: ${APP_GUEST_TRUST_FORWARDED_HEADERS:false}
tmdb:
  api-key: ${TMDB_API_KEY}
  base-url: https://api.themoviedb.org/3
  image-base: https://image.tmdb.org/t/p
