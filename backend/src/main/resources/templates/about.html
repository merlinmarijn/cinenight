<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{about.title}">About - CineNight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #e5e7eb; font-family: sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="max-w-2xl w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
        <span class="text-4xl">🎬</span>

        <h1 class="text-3xl font-bold text-white mt-2" th:text="${appName}">CineNight</h1>

        <p class="text-indigo-400 font-medium" th:text="#{about.subtitle}">Web Design Project</p>
    </div>

    <div class="space-y-6">
        <div class="bg-gray-800/50 p-6 rounded-xl border border-gray-700">

            <h2 class="text-xl font-semibold text-white mb-4" th:text="#{about.info.title}">Project Info</h2>

            <ul class="space-y-2 text-sm text-gray-300">
                <li class="flex justify-between">
                    <span th:text="#{about.developer}">Developer:</span>
                    <span class="font-bold text-white" th:text="${studentName}">Zahid</span>
                </li>
                <li class="flex justify-between">
                    <span th:text="#{about.tech_stack}">Technology:</span>
                    <span class="text-white">Spring Boot 3, React, MySQL, Docker</span>
                </li>
                <li class="flex justify-between">
                    <span th:text="#{about.render_type}">Render Type:</span>
                    <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-xs font-bold border border-emerald-500/30" th:text="#{about.render_val}">Thymeleaf</span>
                </li>
            </ul>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700 text-center">
                <div class="text-3xl font-bold text-indigo-400 mb-1" th:text="${userCount}">0</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider" th:text="#{about.stat.users}">Users</div>
            </div>
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700 text-center">
                <div class="text-sm font-bold text-white mb-1 mt-2" th:text="${serverTime}">Time</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider mt-1" th:text="#{about.stat.time}">Server Time</div>
            </div>
        </div>
    </div>

    <div class="mt-8 text-center">
        <a th:href="${frontendUrl}" class="inline-block px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold transition" th:text="#{about.btn.back}">
            Back to App
        </a>
    </div>
</div>

</body>
</html>
